<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monochrome Sand Simulation</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #000000;
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      .controls {
        position: absolute;
        top: 20px;
        display: flex;
        gap: 12px;
        background: rgba(20, 20, 20, 0.85);
        padding: 10px 18px;
        border-radius: 20px;
        border: 1px solid #333;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }
      button {
        background: #111111;
        color: #eee;
        border: 1px solid #444;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      button:hover {
        background: #222222;
        border-color: #777;
      }
      canvas {
        border-radius: 8px;
        border: 1px solid #222;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9);
        background-color: #050505;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <button id="clearBtn">Clear Canvas</button>
    </div>

    <canvas id="sandCanvas"></canvas>

    <script>
      const canvas = document.getElementById("sandCanvas");
      const ctx = canvas.getContext("2d");

      // Reduced cell size for finer, realistic sand grains
      const CELL_SIZE = 2;
      const GRAVITY = 0.3;
      const MAX_SPEED = 8;

      let cols, rows;
      let grid;

      let isMouseDown = false;
      let mouseX = 0;
      let mouseY = 0;

      // Cell class storing brightness shade & velocity for realism
      class Particle {
        constructor() {
          // Monochromatic shade range (160 - 255) for subtle texture
          this.brightness = Math.floor(160 + Math.random() * 95);
          this.velocity = 1;
        }
      }

      function init() {
        const width = Math.min(900, window.innerWidth - 30);
        const height = Math.min(650, window.innerHeight - 90);

        canvas.width = width;
        canvas.height = height;

        cols = Math.floor(width / CELL_SIZE);
        rows = Math.floor(height / CELL_SIZE);

        grid = createGrid();
      }

      function createGrid() {
        let arr = new Array(cols);
        for (let i = 0; i < arr.length; i++) {
          arr[i] = new Array(rows).fill(null);
        }
        return arr;
      }

      function spawnSand() {
        if (!isMouseDown) return;

        const col = Math.floor(mouseX / CELL_SIZE);
        const row = Math.floor(mouseY / CELL_SIZE);
        const radius = 4; // Brush radius

        for (let i = -radius; i <= radius; i++) {
          for (let j = -radius; j <= radius; j++) {
            if (Math.random() > 0.65) {
              const c = col + i;
              const r = row + j;

              // Check circular boundary for the brush stroke
              if (i * i + j * j <= radius * radius) {
                if (c >= 0 && c < cols && r >= 0 && r < rows) {
                  if (!grid[c][r]) {
                    grid[c][r] = new Particle();
                  }
                }
              }
            }
          }
        }
      }

      function updateGrid() {
        let nextGrid = createGrid();

        // Iterate from bottom to top to prevent double-stepping in a single frame
        for (let y = rows - 1; y >= 0; y--) {
          for (let x = 0; x < cols; x++) {
            let p = grid[x][y];
            if (!p) continue;

            // Apply gravitational acceleration
            p.velocity = Math.min(p.velocity + GRAVITY, MAX_SPEED);
            let steps = Math.max(1, Math.floor(p.velocity));

            let currentX = x;
            let currentY = y;
            let moved = false;

            // Step particle down based on velocity
            for (let step = 0; step < steps; step++) {
              let below = currentY + 1;

              if (
                below < rows &&
                !grid[currentX][below] &&
                !nextGrid[currentX][below]
              ) {
                currentY = below;
                moved = true;
              } else {
                break;
              }
            }

            // Diagonal cascading roll when blocked beneath
            if (!moved) {
              let below = currentY + 1;
              let dir = Math.random() < 0.5 ? 1 : -1;
              let sideA = currentX + dir;
              let sideB = currentX - dir;

              if (
                below < rows &&
                sideA >= 0 &&
                sideA < cols &&
                !grid[sideA][below] &&
                !nextGrid[sideA][below]
              ) {
                currentX = sideA;
                currentY = below;
                moved = true;
              } else if (
                below < rows &&
                sideB >= 0 &&
                sideB < cols &&
                !grid[sideB][below] &&
                !nextGrid[sideB][below]
              ) {
                currentX = sideB;
                currentY = below;
                moved = true;
              }
            }

            // Reset velocity if particle came to rest
            if (!moved) {
              p.velocity = 1;
            }

            nextGrid[currentX][currentY] = p;
          }
        }

        grid = nextGrid;
      }

      function render() {
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let x = 0; x < cols; x++) {
          for (let y = 0; y < rows; y++) {
            let p = grid[x][y];
            if (p) {
              const shade = p.brightness;
              ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade})`;
              ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
          }
        }
      }

      function animate() {
        spawnSand();
        updateGrid();
        render();
        requestAnimationFrame(animate);
      }

      // Event Listeners
      window.addEventListener("resize", init);

      canvas.addEventListener("mousedown", (e) => {
        isMouseDown = true;
        updateMousePos(e);
      });

      canvas.addEventListener("mouseup", () => (isMouseDown = false));
      canvas.addEventListener("mouseleave", () => (isMouseDown = false));

      canvas.addEventListener("mousemove", (e) => {
        updateMousePos(e);
      });

      canvas.addEventListener(
        "touchstart",
        (e) => {
          isMouseDown = true;
          updateTouchPos(e);
        },
        { passive: true },
      );

      canvas.addEventListener("touchend", () => (isMouseDown = false));
      canvas.addEventListener(
        "touchmove",
        (e) => {
          updateTouchPos(e);
        },
        { passive: true },
      );

      function updateMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
      }

      function updateTouchPos(e) {
        if (e.touches.length > 0) {
          const rect = canvas.getBoundingClientRect();
          mouseX = e.touches[0].clientX - rect.left;
          mouseY = e.touches[0].clientY - rect.top;
        }
      }

      document.getElementById("clearBtn").addEventListener("click", () => {
        grid = createGrid();
      });

      init();
      animate();
    </script>
  </body>
</html>
