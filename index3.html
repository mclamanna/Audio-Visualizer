<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
      }
      canvas {
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body
    class="m-0 font-sans text-neutral-200 overflow-hidden h-screen w-screen flex flex-col items-center justify-center bg-gradient-to-b from-black to-slate-900 p-4 md:p-8"
  >
    <div
      class="flex flex-col items-center justify-center w-full max-w-4xl h-full max-h-[90vh] gap-6"
    >
      <h1
        class="text-3xl font-bold tracking-wider text-white text-center drop-shadow-md"
      >
        AUDIO VISUALIZER
      </h1>

      <div
        class="bg-white/5 backdrop-blur-md rounded-3xl border border-white/10 p-6 shadow-2xl w-full shrink-0"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Audio -->
          <div class="flex flex-col gap-3">
            <div>
              <label class="block text-xs font-medium text-neutral-300 mb-1"
                >Upload Audio</label
              >
              <input
                type="file"
                id="audioFile"
                accept="audio/*"
                class="w-full file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-neutral-800 file:text-white hover:file:bg-indigo-600 cursor-pointer p-1 rounded-2xl border border-neutral-700 bg-neutral-950 text-white text-xs"
              />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button
                id="playButton"
                disabled
                class="px-5 py-3 bg-slate-700 hover:bg-indigo-600 disabled:bg-neutral-800 rounded-2xl font-medium transition"
              >
                ▶ Play
              </button>
              <button
                id="stopButton"
                class="px-5 py-3 bg-neutral-800 hover:bg-neutral-700 rounded-2xl font-medium transition"
              >
                ⏹ Stop
              </button>
            </div>
          </div>

          <!-- Controls -->
          <div class="flex flex-col gap-4">
            <!-- Resolution & Quality -->
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-neutral-300 mb-1"
                  >Resolution</label
                >
                <select
                  id="videoResolution"
                  class="w-full px-4 py-3 rounded-2xl border border-neutral-700 bg-neutral-950 text-white text-sm"
                >
                  <option value="1080x1080">1080×1080</option>
                  <option value="1080x1350" selected>1080×1350 (IG)</option>
                  <option value="1920x1080">1920×1080</option>
                  <option value="3840x2160">4K</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-neutral-300 mb-1"
                  >Quality</label
                >
                <select
                  id="videoQuality"
                  class="w-full px-4 py-3 rounded-2xl border border-neutral-700 bg-neutral-950 text-white text-sm"
                >
                  <option value="standard">Standard</option>
                  <option value="high" selected>High</option>
                  <option value="premium">Premium</option>
                  <option value="ultra">Ultra</option>
                </select>
              </div>
            </div>

            <!-- Visualizer Settings -->
            <div
              class="bg-white/5 backdrop-blur-md rounded-3xl border border-white/10 p-5"
            >
              <h3
                class="text-sm font-semibold text-white mb-4 flex items-center gap-2"
              >
                ⚙️ Visualizer Settings
              </h3>

              <div class="grid grid-cols-2 gap-4 text-sm">
                <div>
                  <label class="block text-xs text-neutral-400 mb-1"
                    >Rotation Speed</label
                  >
                  <input
                    type="range"
                    id="rotSpeed"
                    min="0"
                    max="0.05"
                    step="0.0005"
                    value="0.0025"
                    class="w-full accent-violet-500"
                  />
                  <div
                    class="text-xs text-neutral-500 text-right"
                    id="rotValue"
                  >
                    0.0025
                  </div>
                </div>

                <div>
                  <label class="block text-xs text-neutral-400 mb-1"
                    >Trail (Fade)</label
                  >
                  <input
                    type="range"
                    id="trail"
                    min="0.6"
                    max="0.98"
                    step="0.01"
                    value="0.92"
                    class="w-full accent-violet-500"
                  />
                  <div
                    class="text-xs text-neutral-500 text-right"
                    id="trailValue"
                  >
                    0.92
                  </div>
                </div>

                <div>
                  <label class="block text-xs text-neutral-400 mb-1"
                    >Number of Bars</label
                  >
                  <input
                    type="range"
                    id="bars"
                    min="60"
                    max="360"
                    step="12"
                    value="240"
                    class="w-full accent-violet-500"
                  />
                  <div
                    class="text-xs text-neutral-500 text-right"
                    id="barsValue"
                  >
                    240
                  </div>
                </div>

                <div>
                  <label class="block text-xs text-neutral-400 mb-1"
                    >FFT Size</label
                  >
                  <select
                    id="fftSize"
                    class="w-full px-4 py-3 rounded-2xl border border-neutral-700 bg-neutral-950 text-white text-sm"
                  >
                    <option value="512">512 (Fast)</option>
                    <option value="1024">1024</option>
                    <option value="2048" selected>2048 (Balanced)</option>
                    <option value="4096">4096 (Detailed)</option>
                  </select>
                </div>
              </div>

              <!-- Colors -->
              <div class="mt-5 grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs text-neutral-400 mb-1"
                    >Bar Color</label
                  >
                  <input
                    type="color"
                    id="barColor"
                    value="#ec4899"
                    class="w-full h-10 bg-transparent border border-neutral-700 rounded-2xl cursor-pointer"
                  />
                </div>
                <div>
                  <label class="block text-xs text-neutral-400 mb-1"
                    >Center Glow</label
                  >
                  <input
                    type="color"
                    id="centerColor"
                    value="#e0f2fe"
                    class="w-full h-10 bg-transparent border border-neutral-700 rounded-2xl cursor-pointer"
                  />
                </div>
              </div>

              <!-- Center Circle Size -->
              <div class="mt-5">
                <label class="block text-xs text-neutral-400 mb-1"
                  >Center Circle Size</label
                >
                <input
                  type="range"
                  id="centerSize"
                  min="0.0"
                  max="0.85"
                  step="0.01"
                  value="0.48"
                  class="w-full accent-violet-500"
                />
                <div class="flex justify-between text-xs text-neutral-500 mt-1">
                  <span>Tiny / None</span>
                  <span id="centerSizeValue">0.48</span>
                  <span>Large</span>
                </div>
              </div>
              <!-- After Inner Radius slider -->
              <div class="mt-5 grid grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs text-neutral-400 mb-1"
                    >Layers</label
                  >
                  <input
                    type="range"
                    id="layers"
                    min="1"
                    max="6"
                    step="1"
                    value="3"
                    class="w-full accent-violet-500"
                  />
                  <div
                    class="text-xs text-neutral-500 text-center"
                    id="layersValue"
                  >
                    3
                  </div>
                </div>
                <div>
                  <label class="block text-xs text-neutral-400 mb-1"
                    >Layer Spread</label
                  >
                  <input
                    type="range"
                    id="layerSpread"
                    min="0"
                    max="0.35"
                    step="0.01"
                    value="0.12"
                    class="w-full accent-violet-500"
                  />
                  <div
                    class="text-xs text-neutral-500 text-center"
                    id="layerSpreadValue"
                  >
                    0.12
                  </div>
                </div>
                <div>
                  <label class="block text-xs text-neutral-400 mb-1"
                    >Glow Intensity</label
                  >
                  <input
                    type="range"
                    id="glowIntensity"
                    min="0.5"
                    max="3"
                    step="0.1"
                    value="1.8"
                    class="w-full accent-violet-500"
                  />
                  <div
                    class="text-xs text-neutral-500 text-center"
                    id="glowIntensityValue"
                  >
                    1.8
                  </div>
                </div>
              </div>
              <!-- Inner Radius -->
              <div class="mt-5">
                <label class="block text-xs text-neutral-400 mb-1"
                  >Inner Radius (Lines Start)</label
                >
                <input
                  type="range"
                  id="innerRadius"
                  min="0.0"
                  max="0.8"
                  step="0.01"
                  value="0.65"
                  class="w-full accent-violet-500"
                />
                <div class="flex justify-between text-xs text-neutral-500 mt-1">
                  <span>Center</span>
                  <span id="innerRadiusValue">0.65</span>
                  <span>Outer</span>
                </div>
              </div>
            </div>

            <!-- Export Buttons -->
            <button
              id="startExport"
              disabled
              class="w-full py-3 bg-gradient-to-r from-indigo-500 to-violet-600 hover:brightness-110 rounded-2xl font-semibold transition"
            >
              🎥 Start Video Export (MP4/WebM)
            </button>
            <button
              id="stopExport"
              style="display: none"
              class="w-full py-3 bg-red-600 hover:bg-red-500 rounded-2xl font-semibold transition"
            >
              Cancel Export
            </button>

            <div class="grid grid-cols-2 gap-3">
              <button
                id="captureCurrent"
                disabled
                class="py-3 bg-gradient-to-r from-amber-500 to-orange-600 hover:brightness-110 rounded-2xl font-semibold transition"
              >
                📸 Current Frame
              </button>
              <button
                id="capture30s"
                disabled
                class="py-3 bg-gradient-to-r from-amber-500 to-orange-600 hover:brightness-110 rounded-2xl font-semibold transition"
              >
                📸 30s Thumbnail
              </button>
            </div>
          </div>
        </div>

        <div
          class="mt-5 pt-4 border-t border-white/10 flex items-center justify-between text-xs"
        >
          <span id="exportStatus" class="text-neutral-400"
            >Waiting for audio...</span
          >
          <div
            id="progressContainer"
            class="hidden w-56 bg-neutral-900 rounded-full h-1.5"
          >
            <div
              id="progressBar"
              class="bg-gradient-to-r from-indigo-400 to-violet-400 h-1.5 rounded-full w-0 transition-all duration-100"
            ></div>
          </div>
        </div>
      </div>

      <div class="flex-1 w-full flex items-center justify-center min-h-0">
        <canvas
          id="canvas"
          class="max-w-full max-h-full bg-black rounded-3xl shadow-2xl border border-white/10"
        ></canvas>
      </div>
    </div>

    <script src="js/audioEngine3.js"></script>
  </body>
</html>
