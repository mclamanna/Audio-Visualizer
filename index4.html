<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radial Explosion 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <style>
      body {
        font-family: system-ui, sans-serif;
      }
      canvas {
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body
    class="m-0 font-sans text-neutral-200 overflow-hidden h-screen w-screen flex flex-col items-center justify-center bg-gradient-to-b from-black to-slate-900 p-4 md:p-8"
  >
    <div
      class="flex flex-col items-center justify-center w-full max-w-4xl h-full max-h-[90vh] gap-6"
    >
      <h1
        class="text-3xl font-bold tracking-wider text-white text-center drop-shadow-md"
      >
        RADIAL EXPLOSION <span class="text-indigo-400 text-xl">3D</span>
      </h1>

      <div
        class="bg-white/5 backdrop-blur-md rounded-3xl border border-white/10 p-6 shadow-2xl w-full shrink-0"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Audio -->
          <div class="flex flex-col gap-3">
            <div>
              <label class="block text-xs font-medium text-neutral-300 mb-1"
                >Upload Audio</label
              >
              <input
                type="file"
                id="audioFile"
                accept="audio/*"
                class="w-full file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-neutral-800 file:text-white hover:file:bg-indigo-600 cursor-pointer p-1 rounded-2xl border border-neutral-700 bg-neutral-950 text-white text-xs"
              />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button
                id="playButton"
                disabled
                class="px-5 py-3 bg-slate-700 hover:bg-indigo-600 disabled:bg-neutral-800 rounded-2xl font-medium transition"
              >
                ▶ Play
              </button>
              <button
                id="stopButton"
                class="px-5 py-3 bg-neutral-800 hover:bg-neutral-700 rounded-2xl font-medium transition"
              >
                ⏹ Stop
              </button>
            </div>
          </div>

          <!-- Controls -->
          <div class="flex flex-col gap-3">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-neutral-300 mb-1"
                  >Resolution</label
                >
                <select
                  id="videoResolution"
                  class="w-full px-4 py-3 rounded-2xl border border-neutral-700 bg-neutral-950 text-white text-sm"
                >
                  <option value="1080x1080">1080×1080</option>
                  <option value="1080x1350" selected>1080×1350 (IG)</option>
                  <option value="1920x1080">1920×1080</option>
                  <option value="3840x2160">4K</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-neutral-300 mb-1"
                  >Quality</label
                >
                <select
                  id="videoQuality"
                  class="w-full px-4 py-3 rounded-2xl border border-neutral-700 bg-neutral-950 text-white text-sm"
                >
                  <option value="standard">Standard</option>
                  <option value="high" selected>High</option>
                  <option value="premium">Premium</option>
                  <option value="ultra">Ultra (Max)</option>
                </select>
              </div>
            </div>

            <button
              id="startExport"
              disabled
              class="w-full py-3 bg-gradient-to-r from-indigo-500 to-violet-600 hover:brightness-110 rounded-2xl font-semibold transition"
            >
              🎥 Start Video Export (MP4/WebM)
            </button>
            <button
              id="stopExport"
              style="display: none"
              class="w-full py-3 bg-red-600 hover:bg-red-500 rounded-2xl font-semibold transition"
            >
              Cancel Export
            </button>

            <div class="grid grid-cols-2 gap-3">
              <button
                id="captureCurrent"
                disabled
                class="py-3 bg-gradient-to-r from-amber-500 to-orange-600 hover:brightness-110 rounded-2xl font-semibold transition"
              >
                📸 Current Frame
              </button>
              <button
                id="capture30s"
                disabled
                class="py-3 bg-gradient-to-r from-amber-500 to-orange-600 hover:brightness-110 rounded-2xl font-semibold transition"
              >
                📸 30s Thumbnail
              </button>
            </div>
          </div>
        </div>

        <div
          class="mt-5 pt-4 border-t border-white/10 flex items-center justify-between text-xs"
        >
          <span id="exportStatus" class="text-neutral-400"
            >Waiting for audio...</span
          >
          <div
            id="progressContainer"
            class="hidden w-56 bg-neutral-900 rounded-full h-1.5"
          >
            <div
              id="progressBar"
              class="bg-gradient-to-r from-indigo-400 to-violet-400 h-1.5 rounded-full w-0 transition-all duration-100"
            ></div>
          </div>
        </div>
      </div>

      <div class="flex-1 w-full flex items-center justify-center min-h-0">
        <canvas
          id="canvas"
          class="max-w-full max-h-full bg-black rounded-3xl shadow-2xl border border-white/10"
        ></canvas>
      </div>
    </div>

    <script src="js/audioEngine4.js"></script>
  </body>
</html>
