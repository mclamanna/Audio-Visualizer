<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Audio Spectrum Visualizer</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        font-family: Arial, sans-serif;
        color: #ddd;
        overflow: hidden;
      }
      .controls {
        padding: 15px 20px;
        background: #111;
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
        align-items: center;
        border-bottom: 1px solid #222;
      }
      canvas {
        display: block;
        margin: 20px auto;
        background: #111;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      }
      button,
      select,
      input {
        padding: 9px 14px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        background: #222;
        color: #fff;
      }
      button:hover {
        background: #444;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .export-section {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .export-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #exportStatus {
        margin-left: 10px;
        font-weight: bold;
        min-width: 280px;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <div>
        <input type="file" id="audioFile" accept="audio/*" />
        <button id="playButton" disabled>Play</button>
        <button id="stopButton">Stop</button>
      </div>

      <div class="export-section">
        <div class="export-row">
          <label for="videoResolution">Resolution:</label>
          <select id="videoResolution">
            <option value="1080x1080">1080×1080 Square</option>
            <option value="1080x1350" selected>
              1080×1350 (Instagram 4:5)
            </option>
            <option value="1920x1080">1920×1080 Full HD</option>
            <option value="2560x1440">2560×1440 (1440p)</option>
            <option value="3840x2160">3840×2160 (4K)</option>
          </select>
        </div>

        <div class="export-row">
          <label for="videoQuality">Quality:</label>
          <select id="videoQuality">
            <option value="standard">Standard</option>
            <option value="high" selected>High</option>
            <option value="ultra">Ultra</option>
          </select>
        </div>

        <button id="startExport" disabled>Start Export</button>
        <button id="stopExport" disabled style="display: none">
          Stop & Download
        </button>
        <div id="exportStatus"></div>
      </div>
    </div>

    <canvas id="canvas"></canvas>

    <script src="js/audioEngine1.js"></script>
  </body>
</html>
